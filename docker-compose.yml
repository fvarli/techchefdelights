services:
  db:
    image: postgres:16-alpine
    container_name: tcd_db
    restart: unless-stopped
    ports:
      - "5435:5432"  # 5432-5434 occupied on this host (system Postgres + other containers)
    environment:
      POSTGRES_USER: tcd
      POSTGRES_PASSWORD: tcd
      POSTGRES_DB: tcd
    volumes:
      - tcd_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcd -d tcd"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  tcd_db_data:
